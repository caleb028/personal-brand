<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
        <svg viewBox="0 0 120 120" class="w-full h-full">
          <defs>
            <linearGradient id="g2_top" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#46F5E1" />
              <stop offset="100%" stop-color="#19B6A4" />
            </linearGradient>
            <linearGradient id="g2_left" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#15A392" />
              <stop offset="100%" stop-color="#0E6B60" />
            </linearGradient>
            <linearGradient id="g2_right" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#C8A96B" />
              <stop offset="100%" stop-color="#9C7D40" />
            </linearGradient>
            <filter id="f2_glow">
              <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#19B6A4" flood-opacity="0.3" />
            </filter>
          </defs>
          <g filter="url(#f2_glow)">
            <!-- Left Wing -->
            <polygon points="20,44 42,28 42,82 20,98" fill="url(#g2_left)" />
            <!-- Center 'I' Monolith Column -->
            <polygon points="46,24 68,24 68,90 46,90" fill="url(#g2_top)" />
            <!-- Right Wing & Gold Highlight Facet -->
            <polygon points="72,28 94,44 94,98 72,82" fill="url(#g2_right)" />
            <!-- Top Apex Roof Poly -->
            <polygon points="42,28 57,14 72,28 57,40" fill="#E6FFF9" opacity="0.85" />
            <!-- Modern Chamfer Cuts -->
            <line x1="46" y1="24" x2="46" y2="90" stroke="#101B2B" stroke-width="2.5" />
            <line x1="68" y1="24" x2="68" y2="90" stroke="#101B2B" stroke-width="2.5" />
          </g>
        </svg>
        </svg>