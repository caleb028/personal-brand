              <stop offset="0%" stop-color="#2CEFD8" />
              <stop offset="60%" stop-color="#19B6A4" />
              <stop offset="100%" stop-color="#11796D" />
            </linearGradient>
            <linearGradient id="g1_gold" x1="0%" y1="100%" x2="100%" y2="0%">
