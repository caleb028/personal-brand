            <filter id="f1_glow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#19B6A4" flood-opacity="0.35" />
            </filter>
          </defs>
          <!-- Outer Shadow Backplate -->
          <g filter="url(#f1_glow)">
